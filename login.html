<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NEOPOCKET AI - Login</title>
  <link rel="stylesheet" href="style.css"/>
</head>

<body class="login-body">

  <div class="money-rain" id="moneyRain"></div>

  <div class="login-container">
    <div class="login-box">

      <div class="login-header">
        <div class="logo">N</div>
        <h1>NEOPOCKET AI</h1>
        <p>Smart Finance Assistant</p>
      </div>

      <!-- Tab switcher -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Login</button>
        <button class="auth-tab" id="tab-signup" onclick="switchTab('signup')">Sign Up</button>
      </div>

      <!-- LOGIN FORM -->
      <form id="loginForm" class="auth-form" onsubmit="handleLogin(event)">

        <div class="input-group">
          <label>Email</label>
          <input type="email" id="login-email" placeholder="Enter your email" required />
        </div>

        <div class="input-group">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="Enter your password" required />
        </div>

        <div id="login-error" class="auth-error" style="display:none;"></div>

        <button type="submit" class="login-btn">Login</button>

        <p class="signup-text">
          No account? <a href="#" onclick="switchTab('signup'); return false;">Sign up free</a>
        </p>

      </form>

      <!-- SIGNUP FORM -->
      <form id="signupForm" class="auth-form" style="display:none;" onsubmit="handleSignup(event)">

        <div class="input-group">
          <label>Full Name</label>
          <input type="text" id="signup-name" placeholder="Enter your full name" required />
        </div>

        <div class="input-group">
          <label>Email</label>
          <input type="email" id="signup-email" placeholder="Enter your email" required />
        </div>

        <div class="input-group">
          <label>Password</label>
          <input type="password" id="signup-password" placeholder="Create a password (min 6 chars)" required minlength="6"/>
        </div>

        <div class="input-group">
          <label>Confirm Password</label>
          <input type="password" id="signup-confirm" placeholder="Repeat your password" required />
        </div>

        <div id="signup-error" class="auth-error" style="display:none;"></div>
        <div id="signup-success" class="auth-success" style="display:none;"></div>

        <button type="submit" class="login-btn">Create Account</button>

        <p class="signup-text">
          Already have an account? <a href="#" onclick="switchTab('login'); return false;">Login</a>
        </p>

      </form>

    </div>
  </div>

  <style>
    .money-rain{
      position:absolute;
      inset:0;
      overflow:hidden;
      pointer-events:none;
      z-index:1;
    }
    .login-container{
      position:relative;
      z-index:2;
    }
    .money-piece{
      position:absolute;
      top:-50px;
      left:var(--left);
      font-size:var(--size);
      opacity:0;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
      animation: moneyFall var(--dur) cubic-bezier(.45,0,.55,1) var(--delay) forwards;
    }
    @keyframes moneyFall{
      0%   { transform: translateY(0) rotate(0deg);    opacity:0; }
      6%   { opacity:1; }
      82%  { transform: translateY(calc(100vh - var(--land))) rotate(var(--spin)); opacity:1; }
      88%  { transform: translateY(calc(100vh - var(--land) + 6px)) rotate(var(--spin)); }
      100% { transform: translateY(calc(100vh - var(--land))) rotate(var(--spin)); opacity:1; }
    }

    .auth-tabs {
      display: flex;
      gap: 0;
      margin-bottom: 20px;
      background: rgba(255,255,255,0.04);
      border-radius: 10px;
      padding: 4px;
    }
    .auth-tab {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .auth-tab.active {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
    }
    .auth-error {
      background: rgba(252,129,129,0.12);
      border: 1px solid rgba(252,129,129,0.4);
      color: #fc8181;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 12px;
      margin-bottom: 10px;
    }
    .auth-success {
      background: rgba(104,211,145,0.12);
      border: 1px solid rgba(104,211,145,0.4);
      color: #68d391;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 12px;
      margin-bottom: 10px;
    }
  </style>

  <script>
    function switchTab(tab) {
      document.getElementById('loginForm').style.display  = tab === 'login'  ? '' : 'none';
      document.getElementById('signupForm').style.display = tab === 'signup' ? '' : 'none';
      document.getElementById('tab-login').classList.toggle('active',  tab === 'login');
      document.getElementById('tab-signup').classList.toggle('active', tab === 'signup');
      document.getElementById('login-error').style.display = 'none';
      document.getElementById('signup-error').style.display = 'none';
      document.getElementById('signup-success').style.display = 'none';
    }

    function apiRequest(action, data = {}) {
      return fetch(`api.php?action=${encodeURIComponent(action)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify(data)
      }).then(async response => {
        const payload = await response.json().catch(() => null);
        if (!response.ok) {
          throw new Error(payload && payload.error ? payload.error : response.statusText || 'Server error');
        }
        if (payload && payload.error) {
          throw new Error(payload.error);
        }
        return payload || {};
      });
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim().toLowerCase();
      const pass  = document.getElementById('login-password').value;
      const errEl = document.getElementById('login-error');

      errEl.style.display = 'none';
      if (!email || !pass) {
        errEl.textContent = 'Please enter both email and password.';
        errEl.style.display = 'block';
        return;
      }

      try {
        await apiRequest('login', { email, password: pass });
        window.location.href = 'index.html';
      } catch (err) {
        errEl.textContent = '❌ ' + (err.message || 'Login failed');
        errEl.style.display = 'block';
      }
    }

    async function handleSignup(e) {
      e.preventDefault();
      const name    = document.getElementById('signup-name').value.trim();
      const email   = document.getElementById('signup-email').value.trim().toLowerCase();
      const pass    = document.getElementById('signup-password').value;
      const confirm = document.getElementById('signup-confirm').value;
      const errEl   = document.getElementById('signup-error');
      const sucEl   = document.getElementById('signup-success');

      errEl.style.display = 'none';
      sucEl.style.display = 'none';

      if (!name || !email || !pass) {
        errEl.textContent = 'All fields are required.';
        errEl.style.display = 'block';
        return;
      }
      if (pass !== confirm) {
        errEl.textContent = '❌ Passwords do not match.';
        errEl.style.display = 'block';
        return;
      }

      try {
        await apiRequest('signup', { name, email, password: pass });
        sucEl.textContent = '✅ Account created! Redirecting...';
        sucEl.style.display = 'block';
        setTimeout(() => { window.location.href = 'index.html'; }, 800);
      } catch (err) {
        errEl.textContent = '❌ ' + (err.message || 'Signup failed');
        errEl.style.display = 'block';
      }
    }
  </script>

  <script>
    (function moneyRainSetup() {
      const container = document.getElementById('moneyRain');
      const symbols = ['💵', '💰', '🪙', '💴', '💲'];

      function spawnCoin() {
        const el = document.createElement('span');
        el.className = 'money-piece';
        el.textContent = symbols[Math.floor(Math.random() * symbols.length)];

        const left = Math.random() * 96;               // % across screen
        const size = 16 + Math.random() * 20;           // px
        const dur  = 4.5 + Math.random() * 4;            // seconds to fall
        const delay = Math.random() * 3;                 // stagger start
        const land = 8 + Math.random() * 70;              // px from bottom (pile height look)
        const spin = (Math.random() > 0.5 ? 1 : -1) * (200 + Math.random() * 360);

        el.style.setProperty('--left', left + '%');
        el.style.setProperty('--size', size + 'px');
        el.style.setProperty('--dur', dur + 's');
        el.style.setProperty('--delay', delay + 's');
        el.style.setProperty('--land', land + 'px');
        el.style.setProperty('--spin', spin + 'deg');

        container.appendChild(el);

        // Once it lands, remove after a while and spawn a fresh one (keeps it raining forever)
        setTimeout(() => {
          el.remove();
          spawnCoin();
        }, (dur + delay) * 1000 + 1800);
      }

      const COUNT = 26;
      for (let i = 0; i < COUNT; i++) {
        setTimeout(spawnCoin, i * 150);
      }
    })();
  </script>

</body>
</html>
